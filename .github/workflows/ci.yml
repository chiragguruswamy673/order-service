name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build services
        run: mvn -B clean install -pl services/order-service -am

      - name: Start order-service
        run: |
          nohup mvn -pl services/order-service spring-boot:run &
          sleep 20  # wait for server to start

      - name: Run API tests
        run: mvn -pl qa/api-tests test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: qa/api-tests/target/surefire-reports